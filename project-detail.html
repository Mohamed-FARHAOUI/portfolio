<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Project | Tricodes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="portfoilio2.css" type="text/css">
    <link rel="stylesheet" href="portfolio-extra.css" type="text/css">
    <link rel="shortcut icon" href="image/logotop.png" type="image/x-icon">
</head>
<body>

    <nav class="glass">
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <ul id="navMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html">About</a></li>
          <li><a href="index.html">Services</a></li>
          <li><a href="portfolio-all.html">Portfolio</a></li>
          <li><a href="index.html">Contact</a></li>
        </ul>
    </nav>

    <div id="detailContent" class="detail-wrap">
        <!-- filled in by JS, or shows a "not found" message -->
    </div>

    <script src="projects-data.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const project = projectsData.find(p => p.id === id);
        const container = document.getElementById('detailContent');

        if (!project) {
            container.innerHTML = `
                <div class="detail-not-found">
                    <h2>Project not found</h2>
                    <p>The project you're looking for doesn't exist or may have moved.</p>
                    <a class="back-link" href="portfolio-all.html">&larr; Back to all projects</a>
                </div>
            `;
        } else {
            document.getElementById('pageTitle').textContent = project.title + ' | Tricodes';

            const galleryThumbs = project.gallery.length > 1
                ? `<div class="gallery-thumbs" id="thumbs">
                     ${project.gallery.map((img, i) =>
                        `<img src="${img}" alt="${project.title} preview ${i+1}" class="${i === 0 ? 'active' : ''}" data-src="${img}">`
                     ).join('')}
                   </div>`
                : '';

            const links = `
                <div class="detail-links">
                    ${project.liveUrl ? `<a class="primary-link" href="${project.liveUrl}" target="_blank" rel="noopener noreferrer">View Live Site</a>` : ''}
                    ${project.repoUrl ? `<a class="secondary-link" href="${project.repoUrl}" target="_blank" rel="noopener noreferrer">View Code</a>` : ''}
                </div>
            `;

            container.innerHTML = `
                <a class="back-link" href="portfolio-all.html">&larr; Back to all projects</a>

                <div class="detail-header">
                    <span class="detail-category">${project.category}</span>
                    <h1 class="detail-title">${project.title}</h1>
                    <span class="detail-year">${project.year}</span>
                </div>

                <div class="gallery-main">
                    <img id="mainImage" src="${project.gallery[0]}" alt="${project.title}">
                </div>
                ${galleryThumbs}

                <div class="detail-section">
                    <h2>About this project</h2>
                    <p class="detail-description">${project.description}</p>
                </div>

                <div class="detail-section">
                    <h2>Key Features</h2>
                    <ul class="feature-list">
                        ${project.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                </div>

                <div class="detail-section">
                    <h2>Built With</h2>
                    <div class="detail-tech">
                        ${project.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}
                    </div>
                </div>

                ${links}
            `;

            const thumbs = document.querySelectorAll('#thumbs img');
            const mainImage = document.getElementById('mainImage');
            thumbs.forEach(thumb => {
                thumb.addEventListener('click', () => {
                    mainImage.src = thumb.dataset.src;
                    thumbs.forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                });
            });
        }
    </script>

    <script>
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }
        document.querySelectorAll('#navMenu a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.hamburger').classList.remove('active');
                document.getElementById('navMenu').classList.remove('active');
            });
        });
    </script>
</body>
</html>
